name: device_monitor
description: Device activity monitor with Google Drive upload
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
